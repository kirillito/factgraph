[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "factgraph"
version = "0.1.0"
description = "Story-flow linter for state-driven narrative games"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
factgraph = "factgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
factgraph = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
